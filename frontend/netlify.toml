[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws-booking/*"
  to = "https://YOUR_BACKEND_URL.onrender.com/api/ws-booking/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
