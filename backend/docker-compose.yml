version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MaheshDatabase}
      MYSQL_DATABASE: ticketbooking
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: ticket-redis
    ports:
      - "6380:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: ticket-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: ticket-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ticket-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: ticket-ml-service
    ports:
      - "8001:8001"
    restart: always

volumes:
  mysql_data:

