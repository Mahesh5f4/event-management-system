# =============================================================
# EventHub — Production Docker Compose
# =============================================================
# Usage:
#   cp .env.production .env
#   docker compose build
#   docker compose up -d
#
# Boot order (health-check gated):
#   MySQL + Redis + RabbitMQ → auth/event/booking → gateway → nginx
# =============================================================

name: eventhub

networks:
  # Single internal bridge network — all services communicate here.
  # NO service except nginx exposes ports to the host.
  eventhub-net:
    driver: bridge

volumes:
  mysql_data:       # MySQL data persistence
  redis_data:       # Redis AOF persistence
  rabbitmq_data:    # RabbitMQ queue persistence
  grafana_data:     # Grafana dashboards/config persistence
  backups:          # Database backup storage

# =============================================================
# SERVICES
# =============================================================
services:

  # ─── INFRASTRUCTURE ─────────────────────────────────────────

  mysql:
    image: mysql:8.4
    container_name: eventhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticketbooking}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - eventhub-net
    # No ports exposed to host — internal only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: eventhub-redis
    restart: unless-stopped
    # appendonly yes: persists data to disk (AOF)
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eventhub-net
    ports:
      - "6380:6379"
    # No ports exposed to host — internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: eventhub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-eventhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eventhub-net
    ports:
      - "5672:5672"
      - "15672:15672"
    # (Management UI at :15672 is accessible via SSH tunnel if needed)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── ML SERVICE ─────────────────────────────────────────────

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    image: eventhub-ml-service:latest
    container_name: eventhub-ml-service
    restart: unless-stopped
    networks:
      - eventhub-net
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ticketbooking}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EVENT_SERVICE_URL=${EVENT_SERVICE_URL:-http://event-service:8082}
    # No ports exposed to host — accessed internally by event-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── SPRING BOOT SERVICES ───────────────────────────────────

  auth-service:
    build:
      context: .                            # backend/ directory (contains parent pom.xml)
      dockerfile: auth-service/Dockerfile
    image: eventhub-auth-service:latest
    container_name: eventhub-auth-service
    restart: unless-stopped
    environment:
      # Database — points to "mysql" service, not localhost
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Redis — points to "redis" service, not localhost
      SPRING_REDIS_URL: ${SPRING_REDIS_URL}
      # RabbitMQ
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-eventhub}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SPRING_RABBITMQ_VIRTUAL_HOST:-/}
      # Mail
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM}
      # External APIs
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # Admin seed account
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Service port
      PORT: 8081
      # Graceful shutdown
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventhub-net
    healthcheck:
      # Spring Boot actuator health — context-path is /api so endpoint is /api/actuator/health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # Spring Boot startup + DB migration time
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    image: eventhub-event-service:latest
    container_name: eventhub-event-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_REDIS_URL: ${SPRING_REDIS_URL}
      # RabbitMQ
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-eventhub}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SPRING_RABBITMQ_VIRTUAL_HOST:-/}
      # ML service — points to "ml-service" container, not localhost
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
      # Inter-service URLs
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      PORT: 8082
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - eventhub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    image: eventhub-booking-service:latest
    container_name: eventhub-booking-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_REDIS_URL: ${SPRING_REDIS_URL}
      # RabbitMQ — points to "rabbitmq" service, not localhost
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-eventhub}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SPRING_RABBITMQ_VIRTUAL_HOST:-/}
      # Mail
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM}
      # External APIs
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # Inter-service URLs — Docker container names
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8082}
      # Razorpay Payment Gateway
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      PORT: 8083
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventhub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: eventhub-gateway-service:latest
    container_name: eventhub-gateway-service
    restart: unless-stopped
    environment:
      # Routes — Docker service names replace localhost
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8082}
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-http://booking-service:8083}
      # CORS — set to your frontend domain in production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: 8080
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    depends_on:
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    networks:
      - eventhub-net
    # No ports exposed to host — Nginx proxies to this service
    healthcheck:
      # Gateway has no servlet context-path, so actuator is at /actuator/health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── REVERSE PROXY (ONLY PUBLIC-FACING SERVICE) ─────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: eventhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP (redirects to HTTPS once domain is configured)
      - "443:443"     # HTTPS (activate after Let's Encrypt setup)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Let's Encrypt certificate volumes (populated by init-letsencrypt.sh)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - eventhub-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── MONITORING (INTERNAL ONLY — no ports exposed) ──────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: eventhub-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - eventhub-net
    # INTERNAL ONLY — access via: docker exec or SSH tunnel
    # To access temporarily: docker run --rm -p 9090:9090 (or ssh -L 9090:prometheus:9090 ec2...)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: eventhub-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - eventhub-net
    # INTERNAL ONLY — access via SSH tunnel:
    # ssh -L 3000:grafana:3000 ubuntu@<ec2-ip>
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
