# =============================================================
# Nginx — HTTP Server Block (Default / HTTP-First Setup)
# =============================================================
# This is the ACTIVE configuration for initial deployment.
# When you have a domain and Let's Encrypt certs, DISABLE this
# file and ENABLE default-https.conf instead.
#
# To switch to HTTPS:
#   1. Run: ./init-letsencrypt.sh yourdomain.com
#   2. mv nginx/conf.d/default.conf nginx/conf.d/default.conf.bak
#   3. mv nginx/conf.d/default-https.conf nginx/conf.d/default.conf
#   4. docker compose restart nginx
# =============================================================

# Upstream definition for API Gateway
upstream gateway {
    server gateway-service:8080;
    keepalive 32;               # Persistent connections to gateway
}

server {
    listen 80;
    server_name _;              # Matches any hostname (IP or domain)

    # ─── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()" always;

    # ─── Health Check (for AWS Target Groups / ELB) ──────────
    location = /health {
        access_log  off;
        return 200  "healthy\n";
        add_header  Content-Type text/plain;
    }

    # ─── WebSocket — Booking Service Live Updates ─────────────
    location /api/ws-booking/ {
        proxy_pass          http://gateway;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade     $http_upgrade;
        proxy_set_header    Connection  "upgrade";
        proxy_set_header    Host        $host;
        proxy_set_header    X-Real-IP   $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;     # Keep WebSocket connections alive
    }

    # ─── All API Traffic ──────────────────────────────────────
    location / {
        # Rate limiting: allow burst of 50, process without delay
        limit_req   zone=api burst=50 nodelay;
        limit_conn  conn_limit 20;

        proxy_pass          http://gateway;
        proxy_http_version  1.1;

        # Pass real client info to backend services
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        # Required for HTTP/1.1 keepalive with upstream
        proxy_set_header    Connection          "";

        # Timeout settings
        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # Buffer settings for response
        proxy_buffering         on;
        proxy_buffer_size       4k;
        proxy_buffers           8 4k;
    }
}
