server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      routes:
        # Route to Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/register, /api/auth/login, /api/auth/verify-otp, /api/auth/google, /api/auth/forgot-password, /api/auth/reset-password, /api/admin/analytics/**

        # Route to Event Service
        - id: event-service
          uri: ${EVENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/events/**

        # Route to Booking Service
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/bookings/**, /api/seats/**, /api/ws-booking/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    urls:
      - name: Auth APIs
        url: /api/auth/v3/api-docs
      - name: Event APIs
        url: /api/events/v3/api-docs
      - name: Booking APIs
        url: /api/bookings/v3/api-docs
